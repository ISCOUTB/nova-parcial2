
name: Infra - Validación Terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'config/**'
      - '.github/workflows/infra.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'config/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verificar formato
        run: terraform fmt -check -recursive infra

      - name: Inicializar Terraform sin backend
        run: terraform -chdir=infra init -backend=false

      - name: Validar configuración
        run: terraform -chdir=infra validate

  plan:
    name: Planificar infraestructura
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Iniciar sesión en Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Inicializar Terraform con backend remoto
        env:
          ARM_USE_OIDC: 'true'
          ARM_USE_AZUREAD: 'true'
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="resource_group_name=rg-nova-t2-ops" \
            -backend-config="storage_account_name=stnovat2tfssab" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=taller2-dev.tfstate"

      - name: Planificar cambios
        env:
          ARM_USE_OIDC: 'true'
          ARM_USE_AZUREAD: 'true'
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_app_secret: ${{ secrets.APP_SECRET }}
          TF_VAR_resource_group_name: ${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}
          TF_VAR_name_suffix: ${{ vars.TF_VAR_NAME_SUFFIX }}
        run: terraform -chdir=infra plan -input=false
