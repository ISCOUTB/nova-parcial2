
name: Infra - Validación Terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'config/**'
      - '.github/workflows/infra.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'config/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verificar formato
        run: terraform fmt -check -recursive infra

      - name: Inicializar Terraform sin backend
        run: terraform -chdir=infra init -backend=false

      - name: Validar configuración
        run: terraform -chdir=infra validate

  plan:
    name: Planificar infraestructura
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: terraform -chdir=infra init -input=false

      - name: Planificar cambios
        env:
          TF_VAR_app_secret: ${{ secrets.APP_SECRET }}
        run: terraform -chdir=infra plan -input=false
