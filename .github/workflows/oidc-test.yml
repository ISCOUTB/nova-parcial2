
name: Prueba OIDC Azure

'on':
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Verificar GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura del proyecto
        
        run: |
          echo "Proyecto NOVA"
          test -d .github
          test -d infra
          test -d docs
          echo "Estructura base verificada correctamente"

