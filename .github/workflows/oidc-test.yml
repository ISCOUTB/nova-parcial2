name: Prueba OIDC Azure

'on':
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Verificar autenticación OIDC
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura del proyecto
        run: |
          echo "Proyecto NOVA"
          test -d .github
          test -d infra
          test -d docs
          echo "Estructura base verificada correctamente"

      - name: Iniciar sesión en Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar acceso a Azure
        run: az account show --output table
