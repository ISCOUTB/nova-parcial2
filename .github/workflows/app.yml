
name: App - Validación y seguridad

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar y escanear aplicación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos de la aplicación
        run: |
          test -f app/app.py
          test -f app/requirements.txt
          test -f app/Dockerfile
          echo "Archivos de la aplicación encontrados"

      - name: Construir imagen Docker
        if: success()
        run: docker build -t nova-app:test ./app

      - name: Escanear imagen con Trivy
        if: success()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nova-app:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
