
name: App - Validación, seguridad y despliegue

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar y escanear aplicación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos de la aplicación
        run: |
          test -f app/app.py
          test -f app/requirements.txt
          test -f app/Dockerfile
          echo "Archivos de la aplicación encontrados"

      - name: Construir imagen Docker
        run: docker build -t nova-app:test ./app

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nova-app:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: Publicar imagen en Azure Container Registry
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar variables de Azure
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME ACR_LOGIN_SERVER; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar la variable $name en GitHub."
              exit 1
            fi
          done

      - name: Iniciar sesión en Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Iniciar sesión en ACR
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Construir imagen con SHA completo
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/nova-app:$GITHUB_SHA" \
            ./app

      - name: Escanear imagen antes de publicarla
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/nova-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Publicar imagen en ACR
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          docker push "$ACR_LOGIN_SERVER/nova-app:$GITHUB_SHA"

      - name: Guardar etiqueta de la imagen
        id: image
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "uri=$ACR_LOGIN_SERVER/nova-app:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada: $ACR_LOGIN_SERVER/nova-app:$GITHUB_SHA"

  deploy:
    name: Desplegar en Azure Container Apps si existe
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Comprobar variables de despliegue
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
        run: |
          for name in AZURE_RESOURCE_GROUP CONTAINER_APP_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar la variable $name en GitHub."
              exit 1
            fi
          done

      - name: Iniciar sesión en Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Comprobar si existe la Container App
        id: app
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
        run: |
          if az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Container App encontrada."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Container App todavía no existe. Se omite el despliegue inicial."
          fi

    
      - name: Actualizar imagen de Container App
        if: steps.app.outputs.exists == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          IMAGE_URI: ${{ needs.publish.outputs.image_uri }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_URI"

      - name: Verificar endpoint de salud
        if: steps.app.outputs.exists == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then
            echo "::error::No se encontró el dominio público de la aplicación."
            exit 1
          fi

          for i in $(seq 1 12); do
            if curl --fail --silent --show-error "https://$FQDN/health"; then
              echo "Endpoint de salud verificado."
              exit 0
            fi
            sleep 10
          done

          echo "::error::La aplicación no respondió correctamente en /health."
          exit 1
